{% extends "base.html" %}

{% block title %}Create User - DIET Admin{% endblock %}

{% block content %}
<div class="container py-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('admin.dashboard') }}">Admin Dashboard</a></li>
            <li class="breadcrumb-item"><a href="{{ url_for('admin.users_list') }}">Users</a></li>
            <li class="breadcrumb-item active">Create User</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-diet p-4">
                <h4 class="fw-bold text-dark mb-3"><i class="bi bi-person-plus-fill text-primary me-2"></i> Create New User Account</h4>

                <form method="POST" action="{{ url_for('admin.create_user') }}" id="createUserForm">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">User Role</label>
                            <select name="role_id" id="roleSelect" class="form-select" required>
                                {% for r in roles %}
                                    <option value="{{ r.id }}">{{ r.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Full Name</label>
                            <input type="text" name="full_name" class="form-control" placeholder="e.g. Dr. Rajesh Sharma" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Username</label>
                            <input type="text" name="username" class="form-control" placeholder="e.g. 21diet0503 or fac_cse03" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" name="email" class="form-control" placeholder="user@diet.ac.in" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Initial Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter secure initial password" required>
                    </div>

                    <!-- Student Specific Profile Fields -->
                    <div id="studentFields" class="p-3 bg-light rounded-3 border mb-3">
                        <h6 class="fw-bold text-primary small mb-2">Student Profile Information</h6>
                        <div class="row g-2 mb-2">
                            <div class="col-md-6">
                                <label class="form-label small">Roll Number</label>
                                <input type="text" name="roll_number" class="form-control form-control-sm" placeholder="e.g. 218T1A0503">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Branch</label>
                                <select name="branch_id" class="form-select form-select-sm">
                                    {% for b in branches %}
                                        <option value="{{ b.id }}">{{ b.name }} ({{ b.code }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-4">
                                <label class="form-label small">Academic Year</label>
                                <select name="academic_year_id" class="form-select form-select-sm">
                                    {% for y in academic_years %}
                                        <option value="{{ y.id }}">{{ y.label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Semester</label>
                                <select name="semester_id" class="form-select form-select-sm">
                                    {% for s in semesters %}
                                        <option value="{{ s.id }}">{{ s.label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Section</label>
                                <select name="section_id" class="form-select form-select-sm">
                                    {% for sec in sections %}
                                        <option value="{{ sec.id }}">{{ sec.branch.code }} Sem-{{ sec.semester.semester_number }} Sec {{ sec.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Staff Profile Fields -->
                    <div id="staffFields" class="p-3 bg-light rounded-3 border mb-3">
                        <h6 class="fw-bold text-primary small mb-2">Faculty / HOD / Principal Profile Information</h6>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label small">Employee ID</label>
                                <input type="text" name="employee_id" class="form-control form-control-sm" placeholder="e.g. DIET-FAC-105">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">Department</label>
                                <select name="department_id" class="form-select form-select-sm">
                                    {% for d in departments %}
                                        <option value="{{ d.id }}">{{ d.name }} ({{ d.code }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('admin.users_list') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary fw-bold px-4">Create User Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
